name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (compile only)
        run: npm run build

  package:
    # Artifacts are built on main pushes / manual runs only; PRs just get the verify gate.
    # Releasing is a manual step done by the maintainer with the uploaded artifacts.
    if: github.event_name != 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            package-cmd: npm run dist
            artifact: CodeCockpit-win
            paths: |
              dist/*.zip
          # The mac zips (unsigned, zip-only targets) are built on Linux: GitHub's macOS
          # runner pool has repeatedly left jobs queued with no runner assigned until they
          # get cancelled. electron-builder supports unsigned mac zip targets on Linux.
          - os: ubuntu-latest
            platform: mac
            package-cmd: npm run dist:mac
            artifact: CodeCockpit-mac
            paths: dist/*.zip
          - os: ubuntu-latest
            platform: linux-x64
            package-cmd: npm run dist:linux -- --x64
            artifact: CodeCockpit-linux-x64
            paths: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            package-cmd: npm run dist:linux -- --arm64
            artifact: CodeCockpit-linux-arm64
            paths: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Artifact names embed the package.json version; on a release tag, sync it so
      # the produced files carry the tag's version (v1.2.3 → 1.2.3)
      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # npm ci installs only the current platform's node-pty prebuild, but legs that
      # package a second arch in one run need that prebuild too. node-pty ships N-API
      # prebuilds (ABI-stable), so the extra prebuild needs no rebuild step.
      - name: Install darwin node-pty prebuilds
        if: matrix.platform == 'mac'
        run: |
          V=$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")
          npm i --no-save --force @lydell/node-pty-darwin-x64@$V @lydell/node-pty-darwin-arm64@$V

      - name: Install win32-arm64 node-pty prebuild
        if: matrix.platform == 'windows'
        run: npm i --no-save --force @lydell/node-pty-win32-arm64@$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")

      # electron-builder pulls its packaging tooling from GitHub releases mid-build and
      # those downloads intermittently fail with 504; retry the whole step a few times
      - name: Package
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ${{ matrix.package-cmd }}; then exit 0; fi
            echo "::warning::Package attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Smoke test (node-pty prebuild unpacked)
        shell: bash
        run: |
          set -e
          case "${{ matrix.platform }}" in
            windows)
              find dist/CodeCockpit/resources/app.asar.unpacked -name '*.node' | grep -q node-pty-win32-x64
              # GNU tar from Git-bash cannot read zip; the runner's bsdtar can
              /c/Windows/System32/tar.exe -tf dist/*-win-arm64.zip | grep -q node-pty-win32-arm64
              ;;
            mac)
              unzip -l dist/*-mac-arm64.zip | grep -q node-pty-darwin-arm64
              unzip -l dist/*-mac-x64.zip | grep -q node-pty-darwin-x64
              ;;
            linux-x64)
              ls dist/*.deb dist/*.rpm >/dev/null
              ./dist/*.AppImage --appimage-extract >/dev/null
              find squashfs-root -name '*.node' | grep -q node-pty-linux-x64
              rm -rf squashfs-root
              ;;
            linux-arm64)
              ls dist/*.deb dist/*.rpm >/dev/null
              ./dist/*.AppImage --appimage-extract >/dev/null
              find squashfs-root -name '*.node' | grep -q node-pty-linux-arm64
              rm -rf squashfs-root
              ;;
          esac

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    # Tag pushes (v*) produce a DRAFT release — invisible to everyone else until the
    # maintainer reviews the assets on GitHub and clicks Publish. Deleting the tag and
    # pushing it again rebuilds and overwrites the draft's files.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip *.AppImage *.deb *.rpm > SHA256SUMS

      - name: Attach artifacts to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            macOS builds are unsigned — after moving `CodeCockpit.app` to /Applications, run `xattr -cr /Applications/CodeCockpit.app` once (or right-click → Open). Verify downloads against `SHA256SUMS`.
          files: |
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS
