name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (compile only)
        run: npm run build

  package:
    # Artifacts are built on main pushes / manual runs only; PRs just get the verify gate.
    # Releasing is a manual step done by the maintainer with the uploaded artifacts.
    if: github.event_name != 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package-cmd: npm run dist
            artifact: CodeCockpit-win-x64
            paths: dist/*.zip
          - os: macos-latest
            package-cmd: npx electron-builder --mac --publish never
            artifact: CodeCockpit-mac
            paths: dist/*.zip
          - os: ubuntu-latest
            package-cmd: npx electron-builder --linux AppImage --x64 --publish never
            artifact: CodeCockpit-linux-x64
            paths: dist/*.AppImage
          - os: ubuntu-24.04-arm
            package-cmd: npx electron-builder --linux AppImage --arm64 --publish never
            artifact: CodeCockpit-linux-arm64
            paths: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci only installs the current platform's node-pty prebuild. The mac leg packages
      # x64 and arm64 zips in one run, so the other prebuild must be present too.
      # node-pty ships N-API prebuilds (ABI-stable), so no rebuild is needed.
      - name: Install darwin-x64 node-pty prebuild
        if: matrix.os == 'macos-latest'
        run: npm i --no-save @lydell/node-pty-darwin-x64@$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")

      - name: Package
        run: ${{ matrix.package-cmd }}

      - name: Smoke test (node-pty prebuild unpacked)
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            windows-latest)
              find dist/CodeCockpit/resources/app.asar.unpacked -name '*.node' | grep -q node-pty-win32-x64
              ;;
            macos-latest)
              unzip -l dist/*-mac-arm64.zip | grep -q node-pty-darwin-arm64
              unzip -l dist/*-mac-x64.zip | grep -q node-pty-darwin-x64
              ;;
            ubuntu-latest)
              ./dist/*.AppImage --appimage-extract >/dev/null
              find squashfs-root -name '*.node' | grep -q node-pty-linux-x64
              rm -rf squashfs-root
              ;;
            ubuntu-24.04-arm)
              ./dist/*.AppImage --appimage-extract >/dev/null
              find squashfs-root -name '*.node' | grep -q node-pty-linux-arm64
              rm -rf squashfs-root
              ;;
          esac

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
