name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (compile only)
        run: npm run build

      - name: Package
        run: npm run dist

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: CodeCockpit-win-x64
          path: dist/*.zip
          if-no-files-found: error
